function getWeekStart(dstr) { const nd = new Date(dstr); const day = (nd.getDay() + 6) % 7; nd.setDate(nd.getDate() - day); return nd.toISOString().slice(0, 10); }

function fmtMonth(dateStr) { return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { month: "short" }); }

function estimateIF(name, sport) {
  const n = name.toLowerCase();
  if (n.includes("recovery")) return 0.5;
  if (n.includes("cape to cape")) return 0.82; // race stages: avg ~0.77-0.81 FTP, NP higher
  if (n.includes("threshold") || n.includes("overunder") || n.includes("sweetspot")) return 0.75;
  if (n.includes("vo2") || n.includes("pyramid") || n.includes("burst")) return 0.79;
  if (n.includes("tempo")) return 0.735;
  if (n.includes("strength")) return 0.68;
  if (/^back(\s|$)/.test(n)) return 0.53;
  if (n.includes("trail") || n.includes("ubin") || n.includes("mtb") || n.includes("hounds")) return 0.55;
  if (sport === "VirtualRide") return 0.62;
  return 0.58;
}
function estimateTSS(hrs, ifactor) { return hrs * ifactor * ifactor * 100 * CALIBRATION_SCALE; }

// for this athlete's setup, not a settings mismatch.
const CALIBRATION_SCALE = 1.76;
function tsbLabel(tsb) {
  if (tsb > 25) return { text: "Very fresh", color: "#4A6FA5" };
  if (tsb > 5) return { text: "Fresh / race-ready", color: "#3F9C8B" };
  if (tsb > -10) return { text: "Neutral", color: "#8B8D91" };

  return { text: "High fatigue \u2014 watch overreaching", color: "#C6432C" };
}
function stageReadiness(tsb) {
  if (tsb > 15) return { text: "Fresh \u2014 best legs of the race", color: "#4A6FA5" };
  if (tsb > -15) return { text: "Solid \u2014 manageable fatigue", color: "#3F9C8B" };

}

function PMCChart({ data }) {
  const W = 680, H = 220, pad = 8;
  const maxV = Math.max(1, ...data.map((d) => Math.max(d.ctl, d.atl)));
  const minTsb = Math.min(0, ...data.map((d) => d.tsb));
  const maxTsb = Math.max(1, ...data.map((d) => d.tsb));
  const x = (i) => pad + (i / (data.length - 1)) * (W - pad * 2);
  const yLine = (v) => H - pad - (v / maxV) * (H - pad * 2 - 30);
  const yBar = (v) => 30 - ((v - minTsb) / (maxTsb - minTsb)) * 26;
  const path = (key) => data.map((d, i) => `${i === 0 ? "M" : "L"} ${x(i).toFixed(1)} ${yLine(d[key]).toFixed(1)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 260 }}>
      <line x1={pad} y1={H - pad} x2={W - pad} y2={H - pad} stroke="#2A2E33" />
      {data.map((d, i) => (i % 3 === 0 ? <rect key={i} x={x(i) - 1.2} y={30 + Math.min(0, yBar(d.tsb) - 30)} width={2.4} height={Math.abs(yBar(d.tsb) - 30)} fill={d.tsb >= 0 ? "#3A3D42" : "#C6432C"} opacity={0.5} /> : null))}

    </svg>
  );

function WorkoutModal({ day, weekLabel, ftp, setFtp, onClose }) {
  const workout = useMemo(() => generateWorkout(day), [day]);
  if (!workout) return null;
  const w = (pct) => wattsFromPct(pct, ftp);
  const label = `${weekLabel} \u2014 ${day.t}`;
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 20 }} onClick={onClose}>
      <div className="hub-card" style={{ maxWidth: 460, width: "100%", padding: 22, maxHeight: "85vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
          <div className="hub-display" style={{ fontWeight: 700, fontSize: 17, color: "#F4F2ED" }}>{day.t}</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#8B8D91", cursor: "pointer" }}>{ICON.close}</button>
        </div>
        <div style={{ fontSize: 12, color: "#8B8D91", marginBottom: 4 }}>{weekLabel} &middot; {workout.plannedMin}min total</div>
        <div style={{ fontSize: 13, color: "#8B8D91", marginBottom: 16, lineHeight: 1.4 }}>{day.desc}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#15171A", border: "1px solid #2A2E33", borderRadius: 8, padding: "8px 12px", marginBottom: 16 }}>
          <span className="hub-mono" style={{ fontSize: 11, color: "#8B8D91" }}>FTP</span>
          <input type="number" value={ftp} onChange={(e) => setFtp(Math.max(1, parseInt(e.target.value, 10) || 0))} className="hub-mono" style={{ width: 64, background: "#1D2023", border: "1px solid #2A2E33", borderRadius: 6, color: "#F4F2ED", padding: "4px 6px", fontSize: 13 }} />
          <span className="hub-mono" style={{ fontSize: 11, color: "#8B8D91" }}>W</span>
          <span style={{ fontSize: 11, color: "#5C5F63", marginLeft: "auto" }}>watts below update live</span>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {workout.warmup && (
            <div style={{ background: "#15171A", border: "1px solid #2A2E33", borderRadius: 8, padding: "10px 12px" }}>
              <div className="hub-display" style={{ fontSize: 12, fontWeight: 600, color: "#8B8D91" }}>WARM-UP &mdash; {workout.warmup.min}min</div>
              <div className="hub-mono" style={{ fontSize: 14, color: "#F4F2ED", marginTop: 3 }}>{workout.warmup.pctLow}&ndash;{workout.warmup.pctHigh}% FTP <span style={{ color: "#8B8D91" }}>({w(workout.warmup.pctLow)}&ndash;{w(workout.warmup.pctHigh)}W)</span></div>
            </div>
          )}
          {workout.type === "interval" ? (
            <div style={{ background: "#15171A", border: "1px solid #E8A33D", borderRadius: 8, padding: "10px 12px" }}>
              <div className="hub-display" style={{ fontSize: 12, fontWeight: 600, color: "#E8A33D" }}>MAIN SET &mdash; {workout.reps} x [{workout.workSec}s work / {workout.restSec}s easy]</div>
              <div style={{ display: "flex", gap: 20, marginTop: 6 }}>
                <div>
                  <div className="hub-mono" style={{ fontSize: 15, color: "#F4F2ED" }}>{workout.workPct}% FTP <span style={{ color: "#8B8D91", fontSize: 12 }}>({w(workout.workPct)}W)</span></div>
                  <div style={{ fontSize: 11, color: "#8B8D91" }}>work &mdash; {workout.workSec}s</div>
                </div>
                <div>
                  <div className="hub-mono" style={{ fontSize: 15, color: "#4A6FA5" }}>{workout.restPct}% FTP <span style={{ color: "#8B8D91", fontSize: 12 }}>({w(workout.restPct)}W)</span></div>
                  <div style={{ fontSize: 11, color: "#8B8D91" }}>easy &mdash; {workout.restSec}s</div>
                </div>
              </div>
              {workout.fillMin > 0 && (<div style={{ fontSize: 11, color: "#5C5F63", marginTop: 8 }}>+ {workout.fillMin}min easy extension @ {workout.fillPct}% FTP ({w(workout.fillPct)}W) to round out the planned duration.</div>)}
            </div>
          ) : (
            <div style={{ background: "#15171A", border: "1px solid #4A6FA5", borderRadius: 8, padding: "10px 12px" }}>
              <div className="hub-display" style={{ fontSize: 12, fontWeight: 600, color: "#4A6FA5" }}>MAIN SET &mdash; {workout.mainMin}min steady</div>
              <div className="hub-mono" style={{ fontSize: 15, color: "#F4F2ED", marginTop: 3 }}>{workout.pctLow}&ndash;{workout.pctHigh}% FTP <span style={{ color: "#8B8D91", fontSize: 12 }}>({w(workout.pctLow)}&ndash;{w(workout.pctHigh)}W)</span></div>
            </div>
          )}
          {workout.cooldown && (
            <div style={{ background: "#15171A", border: "1px solid #2A2E33", borderRadius: 8, padding: "10px 12px" }}>
              <div className="hub-display" style={{ fontSize: 12, fontWeight: 600, color: "#8B8D91" }}>COOL-DOWN &mdash; {workout.cooldown.min}min</div>
              <div className="hub-mono" style={{ fontSize: 14, color: "#F4F2ED", marginTop: 3 }}>{workout.cooldown.pctHigh}&ndash;{workout.cooldown.pctLow}% FTP <span style={{ color: "#8B8D91" }}>({w(workout.cooldown.pctHigh)}&ndash;{w(workout.cooldown.pctLow)}W)</span></div>
            </div>
          )}
        </div>
        <button onClick={() => downloadFile(`${slugify(label)}.zwo`, toZwoXml(day, workout, label), "application/xml")} className="hub-navbtn" style={{ width: "100%", justifyContent: "center", marginTop: 18, padding: "10px" }}>
          {ICON.refresh} Export as .zwo
        </button>
        <div style={{ fontSize: 11, color: "#5C5F63", marginTop: 10, lineHeight: 1.4 }}>Structure is generated from this session's title and description, not hand-written per workout &mdash; explicit intervals ("8x1min" etc.) are parsed directly; everything else falls back to one steady block at the zone's typical intensity. Powers are stored as %FTP, so this stays correct even after your FTP changes &mdash; in TrainingPeaks too, once imported.</div>
      </div>
    </div>
  );
}

/* ============ DASHBOARD VIEW ============ */
function DashboardView({ goHome, openRefresh }) {
  const [tab, setTab] = useState("weekly");
  const weekly = useMemo(() => {
    const map = new Map();
    RAW.forEach((r) => {
      const wk = getWeekStart(r.date);
      if (!map.has(wk)) map.set(wk, { week: wk, outdoor: 0, indoor: 0, km: 0, elev: 0, rides: 0 });
      const w = map.get(wk);
      if (r.sport === "VirtualRide") w.indoor += r.hrs; else w.outdoor += r.hrs;
      w.km += r.km; w.elev += r.elev; w.rides += 1;
    });
    return Array.from(map.values()).sort((a, b) => (a.week > b.week ? 1 : -1)).map((w) => ({ ...w, label: fmtShort(w.week), outdoor: +w.outdoor.toFixed(1), indoor: +w.indoor.toFixed(1), km: Math.round(w.km) }));
  }, []);
  const monthly = useMemo(() => {
    const map = new Map();
    RAW.forEach((r) => {
      const mk = r.date.slice(0, 7);
      if (!map.has(mk)) map.set(mk, { month: mk, km: 0, hrs: 0, elev: 0, rides: 0 });
      const m = map.get(mk); m.km += r.km; m.hrs += r.hrs; m.elev += r.elev; m.rides += 1;
    });
    return Array.from(map.values()).sort((a, b) => (a.month > b.month ? 1 : -1)).map((m) => ({ ...m, label: fmtMonth(m.month + "-01"), km: Math.round(m.km), hrs: +m.hrs.toFixed(1), elev: Math.round(m.elev) }));
  }, []);
  const quarter = useMemo(() => ({ km: Math.round(RAW.reduce((s, r) => s + r.km, 0)), hrs: +RAW.reduce((s, r) => s + r.hrs, 0).toFixed(0), elev: Math.round(RAW.reduce((s, r) => s + r.elev, 0)), rides: RAW.length }), []);
  const pmc = useMemo(() => {
    const byDate = new Map();
    RAW.forEach((r) => { const tss = estimateTSS(r.hrs, estimateIF(r.name, r.sport)); byDate.set(r.date, (byDate.get(r.date) || 0) + tss); });
    const dates = RAW.map((r) => r.date).sort();
    const cur = new Date(dates[0] + "T00:00:00");
    const end = new Date(TODAY_DATE + "T00:00:00");
    let ctl = 0, atl = 0;
    const series = [];
    while (cur <= end) {
      const key = ymdLocal(cur);
      const tss = byDate.get(key) || 0;
      ctl = ctl + (tss - ctl) / 42;
      atl = atl + (tss - atl) / 7;
      series.push({ date: key, label: fmtShort(key), tss: Math.round(tss), ctl: +ctl.toFixed(1), atl: +atl.toFixed(1), tsb: +(ctl - atl).toFixed(1) });
      cur.setDate(cur.getDate() + 1);
    }
    return series;
  }, []);
  const todayPmc = pmc[pmc.length - 1];
  const latestWeek = weekly[weekly.length - 1], priorWeek = weekly[weekly.length - 2];
  const thisWeek = weekly.find((w) => w.week === getWeekStart(REAL_TODAY)) || { outdoor: 0, indoor: 0, rides: 0 };
  const thisWeekTotal = (thisWeek.outdoor + thisWeek.indoor).toFixed(1);
  const streak = useMemo(() => { const days = new Set(RAW.map((r) => r.date)); let count = 0; let cur = new Date(TODAY_DATE + "T00:00:00"); while (true) { const key = ymdLocal(cur); if (days.has(key)) { count++; cur.setDate(cur.getDate() - 1); } else break; } return count; }, []);
  const recent = RAW.slice(0, 12);

  return (
    <div>
      <TopBar title="Fitness Dashboard" sub="Volume & power, last 13 weeks" onHome={goHome} onRefresh={openRefresh} showHome />
      <div className="hub-hero-grid" style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10, marginBottom: 24 }}>
        {[{ icon: ICON.zap, label: "FTP", val: `${FTP}`, unit: "W" }, { icon: ICON.gauge, label: "VO2max (est.)", val: "50\u201351", unit: "" }, { icon: ICON.timer, label: "This week", val: thisWeekTotal, unit: "hrs" }, { icon: ICON.bike, label: "This week", val: thisWeek ? thisWeek.rides : "\u2014", unit: "rides" }, { icon: ICON.flame, label: "Current streak", val: streak, unit: "days" }].map((c, i) => (
          <div key={i} className="hub-card" style={{ padding: "14px 12px" }}>
            <span style={{ fontSize: 16 }}>{c.icon}</span>
            <div className="hub-mono" style={{ fontSize: 22, fontWeight: 600, marginTop: 8, color: "#F4F2ED" }}>{c.val}<span style={{ fontSize: 12, color: "#8B8D91", marginLeft: 3 }}>{c.unit}</span></div>
            <div style={{ fontSize: 11, color: "#8B8D91", marginTop: 2 }}>{c.label}</div>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8, background: "#1D2023", border: "1px solid #2A2E33", borderRadius: 999, padding: 4, marginBottom: 18, width: "fit-content" }}>
        {["weekly", "monthly", "fitness", "power", "log"].map((t) => (
          <button key={t} className={`hub-tab ${tab === t ? "active" : ""}`} onClick={() => setTab(t)}>{t === "weekly" ? "Weekly" : t === "monthly" ? "Monthly" : t === "fitness" ? "Fitness/Form" : t === "power" ? "Power & Zones" : "Recent Rides"}</button>
        ))}
      </div>
      {tab === "weekly" && (
        <div className="hub-card" style={{ padding: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <div><div className="hub-display" style={{ fontWeight: 600, fontSize: 15, color: "#F4F2ED" }}>Weekly volume &mdash; last {weekly.length} weeks</div><div style={{ fontSize: 12, color: "#8B8D91" }}>Amber = outdoor, blue = Zwift. Hover a bar for detail.</div></div>
            {priorWeek && latestWeek && <div style={{ fontSize: 12, color: (latestWeek.outdoor + latestWeek.indoor) >= (priorWeek.outdoor + priorWeek.indoor) ? "#3F9C8B" : "#C6432C" }}>{(latestWeek.outdoor + latestWeek.indoor) >= (priorWeek.outdoor + priorWeek.indoor) ? "\u2191" : "\u2193"} vs {(priorWeek.outdoor + priorWeek.indoor).toFixed(1)}hrs the week before</div>}
          </div>
          <StackedBarChart data={weekly} />
        </div>
      )}
      {tab === "monthly" && (
        <div>
          <div className="hub-monthly-grid" style={{ display: "grid", gridTemplateColumns: `repeat(${monthly.length + 1}, 1fr)`, gap: 10, marginBottom: 14 }}>
            {monthly.map((m, i) => (<div key={i} className="hub-card" style={{ padding: 14 }}><div className="hub-display" style={{ color: "#E8A33D", fontWeight: 600, fontSize: 13 }}>{m.label}</div><div className="hub-mono" style={{ fontSize: 20, fontWeight: 600, marginTop: 6 }}>{m.km}<span style={{ fontSize: 11, color: "#8B8D91" }}> km</span></div><div style={{ fontSize: 11, color: "#8B8D91", marginTop: 4 }}>{m.hrs} hrs &middot; {m.rides} rides &middot; {m.elev}m climb</div></div>))}
            <div className="hub-card" style={{ padding: 14, borderColor: "#E8A33D" }}><div className="hub-display" style={{ color: "#F4F2ED", fontWeight: 600, fontSize: 13 }}>Quarter</div><div className="hub-mono" style={{ fontSize: 20, fontWeight: 600, marginTop: 6 }}>{quarter.km}<span style={{ fontSize: 11, color: "#8B8D91" }}> km</span></div><div style={{ fontSize: 11, color: "#8B8D91", marginTop: 4 }}>{quarter.hrs} hrs &middot; {quarter.rides} rides &middot; {quarter.elev}m climb</div></div>
          </div>
          <div className="hub-card" style={{ padding: 18 }}><div className="hub-display" style={{ fontWeight: 600, fontSize: 15, color: "#F4F2ED", marginBottom: 14 }}>Distance by month</div><SimpleBarChart data={monthly} color="#E8A33D" /></div>
        </div>
      )}
      {tab === "fitness" && (
        <div>
          <div className="hub-hero-grid" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, marginBottom: 14 }}>
            <div className="hub-card" style={{ padding: 14 }}>
              <div style={{ fontSize: 11, color: "#8B8D91", textTransform: "uppercase", letterSpacing: "0.04em" }}>Fitness (CTL)</div>
              <div className="hub-mono" style={{ fontSize: 26, fontWeight: 600, color: "#4A6FA5", marginTop: 6 }}>{todayPmc.ctl}</div>
            </div>
            <div className="hub-card" style={{ padding: 14 }}>
              <div style={{ fontSize: 11, color: "#8B8D91", textTransform: "uppercase", letterSpacing: "0.04em" }}>Fatigue (ATL)</div>
              <div className="hub-mono" style={{ fontSize: 26, fontWeight: 600, color: "#E0692F", marginTop: 6 }}>{todayPmc.atl}</div>
            </div>
            <div className="hub-card" style={{ padding: 14 }}>
              <div style={{ fontSize: 11, color: "#8B8D91", textTransform: "uppercase", letterSpacing: "0.04em" }}>Form (TSB)</div>
              <div className="hub-mono" style={{ fontSize: 26, fontWeight: 600, color: tsbLabel(todayPmc.tsb).color, marginTop: 6 }}>{todayPmc.tsb > 0 ? "+" : ""}{todayPmc.tsb}</div>
              <div style={{ fontSize: 11, color: tsbLabel(todayPmc.tsb).color, marginTop: 2 }}>{tsbLabel(todayPmc.tsb).text}</div>
            </div>
          </div>
          <div className="hub-card" style={{ padding: 18, marginBottom: 14 }}>
            <div className="hub-display" style={{ fontWeight: 600, fontSize: 15, color: "#F4F2ED", marginBottom: 4 }}>Fitness, Fatigue &amp; Form</div>
            <div style={{ fontSize: 12, color: "#8B8D91", marginBottom: 14 }}>Blue = Fitness, orange = Fatigue, bars = Form. {pmc.length}-day trend.</div>
            <PMCChart data={pmc} />
          </div>
          <div style={{ fontSize: 11, color: "#5C5F63", lineHeight: 1.5 }}>
            Calibrated, not exact: each ride's stress score is estimated from its workout name/type and duration (checked against 4 real power pulls spanning tempo, VO2, technical MTB, and easy-spin sessions), then scaled by 1.76x so today's numbers land on your real TrainingPeaks reading. With TrainingPeaks and Strava both on FTP 260, that factor is almost entirely Garmin reading higher power than Strava for your setup, not an FTP mismatch. Treat the trend as a good approximation, not TrainingPeaks-exact day to day.
          </div>
        </div>
      )}
      {tab === "power" && (
        <div>
          <div className="hub-card" style={{ padding: 18, marginBottom: 14 }}>
            <div className="hub-display" style={{ fontWeight: 600, fontSize: 15, color: "#F4F2ED", marginBottom: 4 }}>Power zones &mdash; FTP {FTP}W</div>
            <div style={{ fontSize: 12, color: "#8B8D91", marginBottom: 14 }}>Manually set, not estimated</div>
            {POWER_ZONES.map((z, i) => (<div key={i} style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 0", borderTop: i > 0 ? "1px solid #2A2E33" : "none" }}><div style={{ width: 10, height: 10, borderRadius: "50%", background: z.color, flexShrink: 0 }} /><div className="hub-mono" style={{ width: 34, fontSize: 12, color: "#8B8D91" }}>{z.z}</div><div style={{ flex: 1, fontSize: 13, color: "#E8E6E1" }}>{z.label}</div><div className="hub-mono" style={{ fontSize: 13, color: "#F4F2ED" }}>{z.range}</div><div style={{ width: 70, textAlign: "right", fontSize: 12, color: "#8B8D91" }}>{z.pct}</div></div>))}
          </div>
          <div className="hub-card" style={{ padding: 18, marginBottom: 14 }}>
            <div className="hub-display" style={{ fontWeight: 600, fontSize: 15, color: "#F4F2ED", marginBottom: 4 }}>Recent power spot-checks</div>
            <div style={{ fontSize: 12, color: "#8B8D91", marginBottom: 14 }}>Sampled from actual ride data</div>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>{SPOT_CHECKS.map((s, i) => (<div key={i} style={{ flex: "1 1 220px", background: "#15171A", border: "1px solid #2A2E33", borderRadius: 8, padding: 12 }}><div style={{ fontSize: 11, color: "#8B8D91" }}>{s.date} &middot; {s.name}</div><div style={{ display: "flex", gap: 16, marginTop: 8 }}><div><div className="hub-mono" style={{ fontSize: 18, fontWeight: 600, color: "#E8A33D" }}>{s.watts}W</div><div style={{ fontSize: 10, color: "#8B8D91" }}>{s.pctFtp}% FTP</div></div><div><div className="hub-mono" style={{ fontSize: 18, fontWeight: 600, color: "#4A6FA5" }}>{s.hr}</div><div style={{ fontSize: 10, color: "#8B8D91" }}>avg bpm</div></div></div><div style={{ fontSize: 11, color: "#3F9C8B", marginTop: 6 }}>{s.zone}</div></div>))}</div>
          </div>
          <div className="hub-card" style={{ padding: 18 }}><div className="hub-display" style={{ fontWeight: 600, fontSize: 15, color: "#F4F2ED", marginBottom: 12 }}>Heart-rate zones</div><div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>{HR_ZONES.map((z, i) => (<div key={i} className="hub-mono" style={{ fontSize: 12, background: "#15171A", border: "1px solid #2A2E33", borderRadius: 6, padding: "6px 10px" }}><span style={{ color: "#8B8D91" }}>{z.z}</span> {z.range}</div>))}</div></div>

/* ============ SHARED: today's form + adaptive plan ============ */
function useTodayFormAndPlan() {
  const todayForm = useMemo(() => {
    const byDate = new Map();
    RAW.forEach((r) => {
      const tss = estimateTSS(r.hrs, estimateIF(r.name, r.sport));
      byDate.set(r.date, (byDate.get(r.date) || 0) + tss);
    });
    const dates = RAW.map((r) => r.date).sort();
    const cur = new Date(dates[0] + "T00:00:00");
    const end = new Date(TODAY_DATE + "T00:00:00");
    let ctl = 0, atl = 0;
    while (cur <= end) {
      const key = ymdLocal(cur);
      const tss = byDate.get(key) || 0;
      ctl = ctl + (tss - ctl) / 42;
      atl = atl + (tss - atl) / 7;
      cur.setDate(cur.getDate() + 1);
    }
    return { ctl, atl };
  }, []);
  const adaptivePlan = useMemo(() => buildAdaptivePlan(todayForm.ctl, todayForm.atl), [todayForm]);
  return { todayForm, adaptivePlan };
}

function fitnessEnteringOn(dateKey) {
  // Actual Fitness (CTL) and Fatigue (ATL) at the start of a past day, replayed from the ride log.
  const byDate = new Map();
  RAW.forEach((r) => { byDate.set(r.date, (byDate.get(r.date) || 0) + estimateTSS(r.hrs, estimateIF(r.name, r.sport))); });
  const dates = RAW.map((r) => r.date).sort();
  const cur = new Date(dates[0] + "T00:00:00");
  let ctl = 0, atl = 0;
  while (ymdLocal(cur) < dateKey) {
    const tss = byDate.get(ymdLocal(cur)) || 0;
    ctl = ctl + (tss - ctl) / 42;
    atl = atl + (tss - atl) / 7;
    cur.setDate(cur.getDate() + 1);
  }
  return { ctl, atl };
}
function formEnteringOn(dateKey) {
  const h = fitnessEnteringOn(dateKey);
  return +(h.ctl - h.atl).toFixed(1);
}

  const inRange = (i) => i >= lo && i <= hi;

  const [ftp, setFtp] = useState(FTP);

    const byDate = new Map();

    const dates = RAW.map((r) => r.date).sort();
    const cur = new Date(dates[0] + "T00:00:00");
    const end = new Date(TODAY_DATE + "T00:00:00");
    let ctl = 0, atl = 0;
    while (cur <= end) {
      const key = ymdLocal(cur);
      const tss = byDate.get(key) || 0;
      ctl = ctl + (tss - ctl) / 42;
      atl = atl + (tss - atl) / 7;
      cur.setDate(cur.getDate() + 1);
    }
    return { ctl, atl };
  }, []);
  const adaptivePlan = useMemo(() => buildAdaptivePlan(todayForm.ctl, todayForm.atl), [todayForm]);
  const weeklyHours = useMemo(() => adaptivePlan.map((w) => +(w.reduce((s, x) => s + (x.skipped ? 0 : x.day.d), 0) / 60).toFixed(1)), [adaptivePlan]);
  const totalAdjustments = useMemo(() => adaptivePlan.filter((_, i) => inRange(i)).flat().filter((x) => x.adjust).length, [adaptivePlan]);
  const gaps = useMemo(() => {
    const allDone = adaptivePlan.filter((_, i) => inRange(i)).flat().filter((x) => x.completed && x.day.d > 0);
    const skipped = allDone.filter((x) => x.compliance.verdict === "skipped");
    const completedDays = allDone.filter((x) => x.compliance.verdict !== "skipped");
    const missed = completedDays.filter((x) => x.compliance.verdict === "missed");
    const partial = completedDays.filter((x) => x.compliance.verdict === "partial");
    const exceeded = completedDays.filter((x) => x.compliance.verdict === "exceeded");
    const matched = completedDays.filter((x) => x.compliance.verdict === "matched" || x.compliance.verdict === "bonus");
    const total = completedDays.length;
    const rate = total > 0 ? Math.round(((total - missed.length) / total) * 100) : 100;
    const hardMissed = missed.filter((x) => ["Z4", "Z5", "Z6"].includes(x.day.z) || /Threshold/.test(x.day.t));
    return { missed, partial, exceeded, matched, skipped, total, rate, hardMissed };

      <div style={{ fontSize: 11, color: "#5C5F63", marginBottom: 18 }}>{mode === "training" ? "Showing the current week by default \u2014 green dot marks it." : "Completed block \u2014 kept here to look back on."}</div>
      <div className="hub-card" style={{ padding: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
          <div><div className="hub-display" style={{ fontWeight: 600, fontSize: 16, color: "#F4F2ED" }}>Week {week + 1} &mdash; {WEEKS[week].theme}</div><div style={{ fontSize: 12, color: "#8B8D91" }}>{dateFor(week, 0)} &ndash; {dateFor(week, 6)}</div></div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div className="hub-mono" style={{ fontSize: 13, color: "#E8A33D" }}>{weeklyHours[week]} hrs riding{WEEKS[week].days.some((d) => d.gym) ? ` \u00b7 ${WEEKS[week].days.filter((d) => d.gym).length} gym` : ""}</div>
            <button className="hub-navbtn" style={{ padding: "5px 10px", fontSize: 11 }} onClick={() => {
              const exportable = adaptivePlan[week].filter((x) => !x.completed && x.day.d > 0 && x.day.z !== "Race");
              const files = [];
              exportable.forEach((x) => {
                const label = `W${week + 1} \u2014 ${x.day.t}`;
                const workout = generateWorkout(x.day);
                if (workout) files.push({ name: `${x.dateKey}-${slugify(label)}.zwo`, content: toZwoXml(x.day, workout, label) });
              });
              if (files.length > 0) downloadFile(`week-${week + 1}-workouts.zip`, makeZip(files), "application/zip");
            }}>{ICON.refresh} Export week (.zip of .zwo)</button>
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {adaptivePlan[week].map((x, i) => {
            const verdictStyle = { matched: { label: "MATCHED", bg: "#3F9C8B" }, bonus: { label: "BONUS RIDE", bg: "#4A6FA5" }, exceeded: { label: "EXCEEDED", bg: "#E0692F" }, skipped: { label: "SKIPPED", bg: "#8B8D91" }, partial: { label: "PARTIAL", bg: "#E8A33D" }, missed: { label: "MISSED", bg: "#C6432C" }, rest: null };
            const v = x.completed ? verdictStyle[x.compliance.verdict] : null;
            let actualLine = null;
            if (x.completed) {
              if (x.compliance.verdict === "rest") actualLine = "Rest day, as planned.";
              else if (x.compliance.verdict === "skipped") actualLine = `Skipped on purpose \u2014 ${SKIPPED_DAYS[x.dateKey]}. Not counted against compliance.`;
              else if (x.compliance.rides.length === 0) actualLine = `No ride logged \u2014 planned ${x.day.t.toLowerCase()} (${x.day.d}min) was skipped.`;
              else {
                const names = x.compliance.rides.map((r) => r.name).join(" + ");
                const pwr = x.compliance.rides.map((r) => POWER_HR_MAP[r.date]).find(Boolean);
                const ratio = x.day.d > 0 ? (x.compliance.actualMin / x.day.d) : 0;
                const overNote = x.compliance.verdict === "exceeded" ? ` \u2014 ${ratio.toFixed(1)}x the planned length, not really the same session` : "";
                actualLine = `${names} \u2014 ${x.compliance.actualMin}min${x.day.d > 0 ? ` vs ${x.day.d}min planned` : ""}${pwr ? `, ${pwr.watts}W avg / ${pwr.hr}bpm avg` : ""}.${overNote}`;
              }
            }
            const clickable = x.day.d > 0 && x.day.z !== "Race" && !x.skipped;
            return (
              <div key={i} onClick={clickable ? () => setOpenDay({ day: x.day, weekLabel: `Week ${week + 1}` }) : undefined} style={{ display: "flex", gap: 12, alignItems: "flex-start", background: "#15171A", border: x.adjust ? "1px solid #E8A33D" : v ? `1px solid ${v.bg}` : x.completed ? "1px solid #3F9C8B" : "1px solid #2A2E33", opacity: x.completed ? 0.85 : 1, borderRadius: 8, padding: "10px 12px", cursor: clickable ? "pointer" : "default" }}>
                <div style={{ width: 76, flexShrink: 0 }}><div className="hub-mono" style={{ fontSize: 11, color: "#8B8D91" }}>{dateFor(week, i)}</div><div className="hub-mono" style={{ fontSize: 10, color: "#5C5F63", marginTop: 2 }}>{x.completed ? "actual" : "form"} {x.tsbBefore > 0 ? "+" : ""}{x.tsbBefore}</div><div className="hub-mono" style={{ fontSize: 10, color: "#5C5F63", marginTop: 1 }} title="Fitness (CTL) and Fatigue (ATL) at the start of this day">fitness {Math.round(x.fit)}</div><div className="hub-mono" style={{ fontSize: 10, color: "#5C5F63", marginTop: 1 }}>fatigue {Math.round(x.fat)}</div></div>
                <div style={{ width: 6, alignSelf: "stretch", borderRadius: 3, background: ZONE_COLOR[x.day.z], flexShrink: 0 }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
                    <span className="hub-display" style={{ fontWeight: 600, fontSize: 13, color: "#F4F2ED" }}>{x.day.t}{v && <span style={{ marginLeft: 8, fontSize: 10, fontWeight: 700, color: "#15171A", background: v.bg, padding: "2px 6px", borderRadius: 4 }}>{v.label}</span>}{x.adjust && <span style={{ marginLeft: 8, fontSize: 10, fontWeight: 700, color: "#15171A", background: "#E8A33D", padding: "2px 6px", borderRadius: 4 }}>{ADJUST_LABEL[x.adjust]}</span>}</span>
                    <span className="hub-mono" style={{ fontSize: 11, color: "#8B8D91" }}>{x.day.d > 0 ? `${x.day.d}min \u00b7 ${x.day.z}` : "\u2014"}</span>
                  </div>
                  <div style={{ fontSize: 12, color: "#8B8D91", marginTop: 3, lineHeight: 1.4 }}>{x.completed ? actualLine : x.day.desc}</div>
                  {x.day.gym && <div style={{ marginTop: 6, padding: "6px 8px", border: "1px solid #3F9C8B", borderRadius: 6, background: "#15171A" }}><div style={{ fontSize: 11, fontWeight: 700, color: "#3F9C8B" }}>GYM &middot; noon &middot; {x.day.gym.d} min &mdash; {x.day.gym.t}</div><div style={{ fontSize: 11, color: "#8B8D91", marginTop: 2, lineHeight: 1.4 }}>{x.day.gym.desc}</div></div>}
                  {clickable && <div style={{ fontSize: 10, color: "#5C5F63", marginTop: 4 }}>Tap for detailed intervals &amp; .zwo export &rarr;</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 20, fontSize: 11, color: "#5C5F63" }}><span>{ICON.trend}</span><span>Sessions are adjusted two ways: the day right after a real ride reacts directly to how that ride compared to plan (much longer eases the next day, a missed hard session can add intensity back if you're fresh enough), and every day beyond that is projected against the aggregate Fitness/Fatigue trend. Re-run "refresh my dashboard" periodically so this reflects real form. Sundays stay free (family day) except where a race falls on one (Stage 4, Oct 18; the crit, Nov 8) &mdash; both fixed by their events. Back-to-back blocks land Fri&ndash;Sat instead of Sat&ndash;Sun.</span></div>
      {openDay && <WorkoutModal day={openDay.day} weekLabel={openDay.weekLabel} ftp={ftp} setFtp={setFtp} onClose={() => setOpenDay(null)} />}
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const [page, setPage] = useState("home");
  const [showRefresh, setShowRefresh] = useState(false);

  const [dataVersion, setDataVersion] = useState(0);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  useEffect(() => {
    if (!msg) return undefined;
    const t = setTimeout(() => setMsg(null), 8000);
    return () => clearTimeout(t);
  }, [msg]);
  async function doRefresh() {
    if (busy) return;
    setBusy(true);
    setMsg(null);
    try {
      const r = await syncFromStrava();
      setDataVersion((v) => v + 1);
      setMsg({ text: "Synced " + r.label + " · " + r.added + " new ride" + (r.added === 1 ? "" : "s") + " · plan updated" });
    } catch (e) {
      const c = e && e.code;
      if (c === "no_mcp") setShowRefresh(true);
      else if (["not_in_manifest", "consent_required", "approval_required", "not_granted", "capability_disabled", "capability_removed"].includes(c)) setMsg({ error: true, text: "Strava access was not allowed for this page. Tap Refresh and choose Allow." });
      else if (["server_not_connected", "needs_reauth", "selection_required", "server_not_found"].includes(c)) setMsg({ error: true, text: "Strava is not connected. Reconnect it in Settings, Connectors." });
      else if (c === "empty") setMsg({ error: true, text: "Strava returned no activities. Try again in a moment." });
      else setMsg({ error: true, text: "Could not reach Strava (" + (c || "unknown") + "). Try again in a moment." });
    } finally {
      setBusy(false);
    }
  }

  useEffect(() => {
    try {
      if (window.storage) {
        window.storage.get("last-page", false).then((r) => { if (r && r.value && ["home", "dashboard", "plan", "archive", "c2c-plan", "crit-plan", "c2c-strategy", "crit-strategy"].includes(r.value)) setPage(r.value); }).catch(() => {});
      }
    } catch (e) {}
  }, []);

  function goTo(p) {
    setPage(p);
    try { if (window.storage) window.storage.set("last-page", p, false).catch(() => {}); } catch (e) {}
  }

  return (
    <div style={{ background: "#15171A", minHeight: "100vh", fontFamily: "Inter, sans-serif", color: "#E8E6E1" }}>
      <RefreshCtx.Provider value={{ run: doRefresh, busy, msg }}>
      <div style={{ maxWidth: 920, margin: "0 auto", padding: "28px 20px 48px" }}>
        <div key={dataVersion}>
        {page === "home" && <Home goTo={goTo} />}
        {page === "dashboard" && <DashboardView goHome={() => goTo("home")} openRefresh={() => setShowRefresh(true)} />}
        {page === "plan" && <PlanView goHome={() => goTo("home")} openRefresh={() => setShowRefresh(true)} />}
        {page === "archive" && <ArchiveView goTo={goTo} goHome={() => goTo("home")} openRefresh={() => setShowRefresh(true)} />}
        {page === "c2c-plan" && <PlanView mode="c2c" goHome={() => goTo("archive")} openRefresh={() => setShowRefresh(true)} />}
        {page === "crit-plan" && <PlanView mode="crit" goHome={() => goTo("archive")} openRefresh={() => setShowRefresh(true)} />}
        {page === "c2c-strategy" && <C2CStrategyView goHome={() => goTo("archive")} openRefresh={() => setShowRefresh(true)} />}
        {page === "crit-strategy" && <CritStrategyView goHome={() => goTo("archive")} openRefresh={() => setShowRefresh(true)} />}
        </div>
      </div>
      {showRefresh && <RefreshNote onClose={() => setShowRefresh(false)} />}
      </RefreshCtx.Provider>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
